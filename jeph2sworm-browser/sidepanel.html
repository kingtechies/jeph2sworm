<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jeph2Sworm</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #e0e0e0;
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .header {
      padding: 12px 16px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 600;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .dot.connected { background: #4caf50; }
    .dot.disconnected { background: #f44336; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px;
    }
    .log {
      padding: 4px 0;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 12px;
      line-height: 1.4;
      border-bottom: 1px solid #2a2a2a;
    }
    .log.success { color: #4caf50; }
    .log.error { color: #f44336; }
    .log.event { color: #64b5f6; }
    .log.command { color: #ffb74d; }
    .toolbar {
      padding: 8px 16px;
      border-top: 1px solid #333;
    }
    button {
      padding: 6px 16px;
      border-radius: 4px;
      border: none;
      background: #4f46e5;
      color: white;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover { background: #6366f1; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Jeph2Sworm Browser</h1>
    <div class="status">
      <span class="dot disconnected" id="status-dot"></span>
      <span id="status-text">Disconnected</span>
    </div>
  </div>
  <div id="messages"></div>
  <div class="toolbar">
    <button id="connect-btn">Connect</button>
  </div>
  <script src="dist/sidepanel.js" type="module"></script>
</body>
</html>
