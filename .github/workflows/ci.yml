name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Python Backend ────────────────────────────────────────────────
  python:
    name: Python Backend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('jeph2sworm-core/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: jeph2sworm-core
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff mypy

      - name: Lint with ruff
        working-directory: jeph2sworm-core
        run: |
          ruff check jeph2sworm/ --select E,F,W --ignore E501
        continue-on-error: true

      - name: Type check with mypy
        working-directory: jeph2sworm-core
        run: |
          mypy jeph2sworm/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

      - name: Run tests
        working-directory: jeph2sworm-core
        run: |
          pytest tests/ -v --tb=short --cov=jeph2sworm --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: jeph2sworm-core/coverage.xml

  # ── VS Code Extension ────────────────────────────────────────────
  vscode:
    name: VS Code Extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: jeph2sworm-vscode/package-lock.json

      - name: Install dependencies
        working-directory: jeph2sworm-vscode
        run: npm ci || npm install

      - name: Lint
        working-directory: jeph2sworm-vscode
        run: npm run lint
        continue-on-error: true

      - name: Build extension
        working-directory: jeph2sworm-vscode
        run: npm run build

      - name: Build webview-ui
        working-directory: jeph2sworm-vscode/webview-ui
        run: |
          npm ci || npm install
          npm run build
        continue-on-error: true

  # ── Chrome Extension ──────────────────────────────────────────────
  chrome:
    name: Chrome Extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: jeph2sworm-browser/package-lock.json

      - name: Install dependencies
        working-directory: jeph2sworm-browser
        run: npm ci || npm install

      - name: Lint
        working-directory: jeph2sworm-browser
        run: npm run lint
        continue-on-error: true

      - name: Build extension
        working-directory: jeph2sworm-browser
        run: npm run build

  # ── Docker ────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [python]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -f docker/Dockerfile -t jeph2sworm:test .
        continue-on-error: true
